pipeline:
  output_dir: ./export
  enforce_boundaries: true

boundaries:
  protected_paths:
    - ./blocks
  allowed_output_paths:
    - ./export
  validate_before_assembly: true

# Embedding configuration for semantic search
embeddings:
  # Model: openai (text-embedding-3-small) or local (sentence-transformers)
  model: openai
  # OpenAI model name (if model: openai)
  openai_model: text-embedding-3-small
  # Local model name (if model: local)
  local_model: all-MiniLM-L6-v2
  # Output database
  database: ./index/embeddings.sqlite
  # Chunking settings
  chunk_size: 512      # tokens per chunk
  chunk_overlap: 64    # overlap between chunks
  # Search defaults
  search_limit: 10
  similarity_threshold: 0.3

# Block types for filtering
block_types:
  - frameworks
  - checklists
  - plans
  - narratives
  - conclusions
  - patterns
